# Lantern on one VPS (ADR-0015). Run from this directory:
#   docker compose up -d                      # caddy, app, db, backup
#   docker compose --profile broadcast up -d  # also the cloud broadcaster
#   docker compose --profile tts up -d        # also the self-hosted voice
#   docker compose --profile signer up -d     # also the self-hosted TikTok signer
name: lantern

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]
    logging: *logging

  app:
    image: ${APP_IMAGE:-lantern-app:local}
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      TRUST_PROXY: "true"
      PUBLIC_URL: https://${DOMAIN}
      DATABASE_URL: postgres://lantern:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@db:5432/lantern
      BROADCASTER_URL: http://broadcaster:8090
      # Not "http://app:8080": "app" is an HSTS-preloaded TLD, so Chromium would force HTTPS.
      BROADCAST_STAGE_ORIGIN: http://lantern-app:8080
      # Used only with POCKET_TTS_SECRET set in .env (and the tts profile running).
      POCKET_TTS_URL: http://lantern-tts:8793
    read_only: true
    tmpfs:
      - /tmp
    init: true
    # The app drains on SIGTERM: flushes stores, tells stages to hold, closes sockets.
    stop_grace_period: 25s
    depends_on:
      db:
        condition: service_healthy
    networks:
      edge: {}
      internal:
        aliases: [lantern-app]
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lantern
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: lantern
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=500
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lantern -d lantern"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb
    networks: [internal]
    logging: *logging

  backup:
    image: ${BACKUP_IMAGE:-lantern-backup:local}
    build:
      context: ./backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: lantern
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: lantern
      BACKUP_AT: ${BACKUP_AT:-03:15}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-lantern}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Needs the internal network for the database and egress for S3 uploads.
    networks: [internal, egress]
    logging: *logging

  broadcaster:
    profiles: [broadcast]
    image: ${BROADCASTER_IMAGE:-lantern-broadcaster:local}
    build:
      context: ..
      dockerfile: deploy/broadcaster.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8090"
      # Required by the broadcaster itself (24+ characters); it won't start without it.
      BROADCASTER_TOKEN: ${BROADCASTER_TOKEN:-}
      STAGE_ORIGINS: http://lantern-app:8080
      BROADCAST_MAX_CONCURRENT: ${BROADCAST_MAX_CONCURRENT:-1}
      # auto: the stage encodes H.264 in Chrome (ADR-0020). x264: raw frames, encoded by ffmpeg (about 1 vCPU more).
      VIDEO_ENCODER: ${VIDEO_ENCODER:-auto}
    init: true
    shm_size: 1gb
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${BROADCASTER_CPUS:-3}"
          memory: 3g
    # Internal for the app; egress to reach TikTok's RTMPS ingest.
    networks: [internal, egress]
    logging: *logging

  # Self-hosted TikTok signer (apps/signer, ADR-0023): docker compose --profile signer up -d, with
  # SIGNER_URL=http://lantern-signer:8091 and SIGNER_TOKEN (24+ characters) set in .env. It replaces Euler Stream.
  signer:
    profiles: [signer]
    image: ${SIGNER_IMAGE:-lantern-signer:local}
    build:
      context: ..
      dockerfile: deploy/signer.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8091"
      # Required by the signer itself (24+ characters); it won't start without it.
      SIGNER_TOKEN: ${SIGNER_TOKEN:-}
      # Where the browser's traffic leaves from: TikTok may show a login wall to data-center addresses.
      SIGNER_PROXY_URL: ${SIGNER_PROXY_URL:-}
      SIGNER_LOCALE: ${SIGNER_LOCALE:-en-US}
      SIGNER_TIMEZONE: ${SIGNER_TIMEZONE:-America/New_York}
      SIGNER_MAX_CONCURRENT: ${SIGNER_MAX_CONCURRENT:-4}
    # On the server's loopback only, so scripts/verify-signer.ts can reach it; the bearer token still applies.
    ports:
      - "127.0.0.1:8091:8091"
    init: true
    shm_size: 512mb
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${SIGNER_CPUS:-1}"
          memory: 1g
    # Internal for the app; egress to reach TikTok.
    networks:
      internal:
        aliases: [lantern-signer]
      egress: {}
    logging: *logging

  # Self-hosted pt-BR voice (services/tts, ADR-0021): docker compose --profile tts up -d,
  # with POCKET_TTS_SECRET set. The build downloads the model (360 MB) from Hugging Face.
  tts:
    profiles: [tts]
    image: ${TTS_IMAGE:-lantern-tts:local}
    build:
      context: ../services/tts
    restart: unless-stopped
    environment:
      # Without it the service idles and refuses every call.
      TTS_SECRET: ${POCKET_TTS_SECRET:-}
      TTS_VOICE: ${POCKET_TTS_VOICE:-rafael}
      # Spelled out: the service parses these with int(), so an empty value would crash it.
      TTS_MAX_ACTIVE: "16"
      TTS_MAX_CHARS: "2000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8793/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    init: true
    deploy:
      resources:
        limits:
          # Its threads follow this quota (cgroup).
          cpus: "${TTS_CPUS:-2}"
          memory: 1g
    networks:
      internal:
        aliases: [lantern-tts]
    logging: *logging

networks:
  edge: {}
  egress: {}
  internal:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  db_data: {}
