<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="stage.css" />
  </head>
  <body>
    <!-- Designed for a 1080x1920 OBS browser source. Everything that matters
         sits in the upper ~62% because TikTok draws comments and the gift
         tray over the bottom of the frame. -->
    <main id="frame">
      <canvas id="scene" width="1080" height="1920"></canvas>

      <header id="chrome">
        <p id="segment"></p>
        <p id="disclosure">AI host</p>
      </header>

      <section id="caption" aria-live="polite"></section>
      <ol id="alerts" aria-live="polite"></ol>

      <button id="unmute" hidden>Turn on sound</button>
    </main>
    <script type="module" src="stage.js"></script>
  </body>
</html>
