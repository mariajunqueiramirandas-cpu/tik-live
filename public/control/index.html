<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Show control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="control.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="status">
        <span id="status-dot" class="dot"></span>
        <h1 id="status-title">Connecting…</h1>
        <p id="status-detail"></p>
      </div>
      <div class="stats">
        <p><strong id="viewers">0</strong> watching</p>
        <p><strong id="likes">0</strong> likes</p>
        <p><strong id="uptime">0</strong> min on air</p>
      </div>
      <div class="kill">
        <button id="skip" class="quiet">Skip line</button>
        <button id="pause" class="danger">Pause host</button>
      </div>
    </header>

    <main class="layout">
      <section class="speech">
        <h2>Saying now</h2>
        <p id="now-playing" class="now-playing">Nothing yet.</p>

        <form id="say-form" class="inline-form">
          <label for="say-input">Make the host say</label>
          <div class="row">
            <input id="say-input" type="text" maxlength="300" placeholder="Type a line and press Say" autocomplete="off" />
            <button type="submit">Say</button>
          </div>
        </form>

        <h2>Transcript</h2>
        <ol id="transcript" class="transcript"></ol>
      </section>

      <section class="show">
        <h2>Segment</h2>
        <p id="segment-detail" class="muted"></p>
        <div id="segments" class="segments"></div>

        <h2>Up next</h2>
        <ol id="queue" class="queue"></ol>
        <p id="dropped" class="muted"></p>

        <h2>Test the show</h2>
        <form id="inject-form" class="inject">
          <div class="row">
            <select id="inject-kind" aria-label="Event type">
              <option value="chat">Chat</option>
              <option value="gift">Gift</option>
              <option value="follow">Follow</option>
            </select>
            <input id="inject-handle" type="text" value="test_viewer" aria-label="Viewer name" />
          </div>
          <div class="row">
            <input id="inject-text" type="text" placeholder="Message, or gift name" aria-label="Message or gift name" />
            <input id="inject-count" type="number" min="1" value="1" aria-label="Gift count" />
            <button type="submit">Send</button>
          </div>
        </form>
      </section>

      <aside class="side">
        <div class="preview">
          <iframe src="/stage/?preview=1" title="Stage preview (muted)"></iframe>
        </div>
        <h2>Health</h2>
        <dl id="health" class="health"></dl>
      </aside>

      <section class="log-wrap">
        <h2>Log</h2>
        <ol id="log" class="log"></ol>
      </section>
    </main>

    <script type="module" src="control.js"></script>
  </body>
</html>
