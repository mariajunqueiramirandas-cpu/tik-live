name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run boundaries
      - name: Validate compose files (plain VPS and Dokploy)
        env:
          DOMAIN: ci.example.com
          POSTGRES_PASSWORD: ci
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yaml --profile broadcast --profile tts config -q
          docker compose -f compose.dokploy.yaml --env-file deploy/dokploy.env.example --profile broadcast --profile tts config -q
      - run: bun test
      # Builds the web app (with prerender), the server, the broadcaster and the Windows bridge agent.
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
      # The unstamped agent from main, for trying a change before a release (pair it with a code).
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: lantern-bridge
          path: apps/bridge/dist/lantern-bridge.exe
          retention-days: 7

  # services/tts: the C++ engine against its numpy reference (a tiny random model, no download).
  tts:
    name: Voice service (services/tts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/tts/requirements.txt
      - run: pip install -r requirements.txt
      - run: make -C engine -j"$(nproc)" CXXFLAGS="-O3 -Werror"
      - run: python -m unittest discover -s tests -t . -v

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run --filter @tik-live/web build
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The Windows Local Bridge Agent on the GitHub release (ADR-0047). Cross-compiled
  # on Linux. The dashboard serves its own stamped copy from the app image; this
  # one is generic and pairs with a code typed from the dashboard.
  bridge:
    name: Publish the bridge agent
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, e2e]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build:bridge
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/bridge/dist/lantern-bridge.exe
          generate_release_notes: true

  images:
    name: Publish images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, tts, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "app=ghcr.io/${owner}/lantern-app" >> "$GITHUB_OUTPUT"
          echo "broadcaster=ghcr.io/${owner}/lantern-broadcaster" >> "$GITHUB_OUTPUT"
          echo "tts=ghcr.io/${owner}/lantern-tts" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/app.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.version }},${{ steps.meta.outputs.app }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/broadcaster.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.broadcaster }}:${{ steps.meta.outputs.version }},${{ steps.meta.outputs.broadcaster }}:latest
          cache-from: type=gha,scope=broadcaster
          cache-to: type=gha,mode=max,scope=broadcaster
      - uses: docker/build-push-action@v6
        with:
          context: services/tts
          push: true
          tags: ${{ steps.meta.outputs.tts }}:${{ steps.meta.outputs.version }},${{ steps.meta.outputs.tts }}:latest
          cache-from: type=gha,scope=tts
          cache-to: type=gha,mode=max,scope=tts
